title: SCII Gate Rejected a Release (Correlation Base)
id: 4174ed1a-0d2c-435d-9818-4b15f22de625
name: scii_base_gate_rejected
status: experimental
description: Base rule of the correlation in this file. A gate decision to reject a release.
references:
    - https://github.com/alexqzm/scii-gate
author: Alexander Kuzmin
date: 2026-11-09
logsource:
    product: scii
    service: gate
    definition: 'Requirements: SCII telemetry in schema 1 (schema/scii-event.schema.json), e.g. python -m sciitel export'
detection:
    selection:
        event.action: gate-decision
