title: Release Rejected by SCII Gate Installed on a Device
id: cfa837b9-71df-4bb8-85c1-b088a986e98a
status: experimental
description: |
    Detects an image that the SCII gate rejected and that a device then installed: the gate decision and the
    installation report carry the same image SHA-256 within 30 days. The gate decided correctly, but the
    decision did not reach the device, either because the device does not check receipts or because the image
    came by another path. In cps-update-lab this happens at protection levels L0 and L1 with images signed with
    stolen keys, builds from a compromised build environment and the release archive that differs from the tag.
    The lab uses the same malicious image for the replacement on the update server and for the rogue
    engineering workstation, so those scenarios match as well. The 30-day window is a parameter of the rule.
references:
    - https://github.com/alexqzm/scii-gate
    - https://github.com/alexqzm/cps-update-lab
author: Alexander Kuzmin
date: 2026-11-09
tags:
    - attack.initial-access
    - attack.t0862
    - attack.t1195.002
correlation:
    type: temporal_ordered
    rules:
        - scii_base_gate_rejected
        - scii_base_device_installed
    group-by:
        - file.hash.sha256
    timespan: 30d
falsepositives:
    - A release rejected for missing evidence and admitted later under the same image; check for a later admission.
level: critical
