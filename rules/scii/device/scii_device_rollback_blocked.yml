title: SCII Firmware Rollback Blocked by Device
id: 65726d36-0afc-45bc-ad43-24f50211a26a
status: experimental
description: |
    Detects a device refusing an update because the security version number in the receipt is lower than the
    installed one (ROLLBACK). The older release may be genuine and once admitted by the gate; installing it
    would bring back fixed vulnerabilities (scenario A4 of cps-update-lab at protection level L2).
references:
    - https://github.com/alexqzm/scii-verify/blob/main/docs/device-checks.md
    - https://github.com/alexqzm/cps-update-lab
author: Alexander Kuzmin
date: 2026-11-09
tags:
    - attack.defense-impairment
    - attack.t1689
    - attack.persistence
    - attack.t1693.001
logsource:
    product: scii
    service: device
    definition: 'Requirements: SCII telemetry in schema 1 (schema/scii-event.schema.json), e.g. python -m sciitel export'
detection:
    selection:
        event.action: device-reject
        event.reason: ROLLBACK
    condition: selection
falsepositives:
    - Deliberate downgrades by operators, which should go through a new gate decision with a higher version number.
level: high
